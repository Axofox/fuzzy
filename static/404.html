<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Not found</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1b1b1f; --muted:#6b7280; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14151a; --fg:#e7e7ea; --muted:#9aa0aa; } }
  html, body { touch-action: manipulation; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  p { color: var(--muted); margin: 0; }
  .lang-picker { font-size: 13px; color: var(--muted); background: var(--bg); border: 1px solid var(--muted); border-radius: 6px; padding: 4px 8px; }
</style>
</head>
<body>
<p data-i18n="notFound">This note doesn't exist.</p>
<select class="lang-picker" aria-label="Language"></select>
<script src="/i18n.js"></script>
</body>
</html>
