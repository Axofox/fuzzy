<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Notes</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1b1b1f; --muted:#6b7280; --link:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14151a; --fg:#e7e7ea; --muted:#9aa0aa; --link:#7db4ff; } }
  html, body { touch-action: manipulation; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { text-align:center; }
  p { color: var(--muted); }
  a { color: var(--link); text-decoration:none; font-weight:600; }
  a:hover { text-decoration:underline; }
  .lang-picker { margin-top: 16px; font-size: 13px; color: var(--muted); background: var(--bg); border: 1px solid var(--muted); border-radius: 6px; padding: 4px 8px; }
</style>
</head>
<body>
<main>
  <p data-i18n="nothingHere">Nothing to see here.</p>
  <a href="/write" data-i18n="writeNoteLink">Write a note →</a>
  <br>
  <select class="lang-picker" aria-label="Language"></select>
</main>
<script src="/i18n.js"></script>
</body>
</html>
