<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Write a note</title>
<link rel="stylesheet" href="write.css">
</head>
<body>
<main>
  <div class="manage-header">
    <h1 id="page-heading">Write a note</h1>
    <div class="header-controls">
      <a href="/write/manage" class="back-link" data-i18n="manageNotesLink">Manage notes &rarr;</a>
      <select class="lang-picker" aria-label="Language"></select>
    </div>
  </div>

  <div class="tabs">
    <button type="button" id="tab-write" class="tab-btn active" data-i18n="tabWrite">Write</button>
    <button type="button" id="tab-preview" class="tab-btn" data-i18n="tabPreview">Preview</button>
  </div>

  <div id="write-pane">
    <div class="toolbar">
      <button type="button" id="btn-bold" data-i18n-title="boldTitle" title="Bold"><b>B</b></button>
      <button type="button" id="btn-italic" data-i18n-title="italicTitle" title="Italic"><i>I</i></button>
      <span class="toolbar-divider"></span>
      <button type="button" class="color-btn" data-color="green" data-i18n-title="greenTitle" title="Green text" style="--swatch:#22c55e"></button>
      <button type="button" class="color-btn" data-color="yellow" data-i18n-title="yellowTitle" title="Yellow text" style="--swatch:#eab308"></button>
      <button type="button" class="color-btn" data-color="red" data-i18n-title="redTitle" title="Red text" style="--swatch:#ef4444"></button>
      <button type="button" class="color-btn" data-color="purple" data-i18n-title="purpleTitle" title="Purple text" style="--swatch:#a855f7"></button>
      <span class="toolbar-divider"></span>
      <button type="button" id="btn-emoji" data-i18n-title="emojiTitle" title="Insert emoji">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14c.9 1.2 2.1 1.8 3.5 1.8s2.6-.6 3.5-1.8"/><line x1="9" y1="9.5" x2="9.01" y2="9.5"/><line x1="15" y1="9.5" x2="15.01" y2="9.5"/></svg>
      </button>
      <button type="button" id="btn-image" data-i18n-title="imageTitle" title="Insert image">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M4.5 16.5 9 12l3 3 3.5-3.5L19.5 16"/></svg>
      </button>
      <input type="file" id="file-input" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
    </div>

    <div id="emoji-panel" class="emoji-panel hidden">
      <input type="text" id="emoji-search" data-i18n-placeholder="emojiSearchPlaceholder" placeholder="Search emoji…">
      <div id="emoji-grid" class="emoji-grid"></div>
    </div>

    <textarea id="editor" data-i18n-placeholder="editorPlaceholder" placeholder="Write your note here. Drag & drop or paste screenshots directly in."></textarea>
    <p class="hint" data-i18n="dragDropHint">Drag &amp; drop images here, or paste a screenshot straight from your clipboard.</p>

    <div class="thumbs" id="thumbs"></div>
  </div>

  <div id="preview-pane" class="preview-pane hidden"></div>

  <div class="publish-row">
    <div class="slug-field">
      <span class="slug-prefix" id="slug-prefix">yoursite.netlify.app/</span>
      <input type="text" id="slug-input" data-i18n-placeholder="slugPlaceholder" placeholder="custom-link (optional)">
    </div>
    <div id="slug-status" class="slug-status"></div>
  </div>

  <button type="button" id="btn-publish" class="publish-btn">Publish</button>

  <div id="result" class="result hidden"></div>
  <div id="error" class="error hidden"></div>
</main>
<script src="/i18n.js"></script>
<script src="emoji-data.js"></script>
<script src="write.js"></script>
</body>
</html>
