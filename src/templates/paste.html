<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{TITLE}}</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1b1b1f;
    --muted: #6b7280;
    --border: #e5e7eb;
    --code-bg: #f3f4f6;
    --link: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151a;
      --fg: #e7e7ea;
      --muted: #9aa0aa;
      --border: #2a2b32;
      --code-bg: #1d1e24;
      --link: #7db4ff;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    /* Stops the page from feeling "floaty" on a long press: disables
       pinch/double-tap zoom while leaving normal scrolling untouched. */
    touch-action: manipulation;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  h1, h2, h3, h4, h5, h6 { line-height: 1.3; }
  p { margin: 0 0 1em; overflow-wrap: break-word; }
  a { color: var(--link); }
  img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    -webkit-user-drag: none;
    user-drag: none;
    -webkit-touch-callout: none;
    display: block;
    margin: 1em 0;
  }
  code {
    background: var(--code-bg);
    padding: 0.15em 0.4em;
    border-radius: 4px;
    font-size: 0.9em;
  }
  pre {
    background: var(--code-bg);
    padding: 14px 16px;
    border-radius: 8px;
    overflow-x: auto;
  }
  pre code { background: none; padding: 0; }
  blockquote {
    margin: 1em 0;
    padding: 0 1em;
    border-left: 3px solid var(--border);
    color: var(--muted);
  }
  hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
  table { border-collapse: collapse; width: 100%; margin: 1em 0; }
  th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 40px;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>
<main>
{{CONTENT}}
</main>
<footer>Read-only note &middot; <code>/{{SLUG}}</code></footer>
</body>
</html>
