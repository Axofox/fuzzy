[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[[headers]]
  for = "/write/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Netlify automatically serves /404.html (in the publish dir) for any
# unmatched path, so no explicit redirect rule is needed for that.
